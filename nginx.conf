map $http_user_agent $bad_agent {
    default 0;
    ""      1;
    "~*(nikto|sqlmap|nmap|masscan|acunetix|nessus|zgrab|gobuster|dirbuster|feroxbuster|ffuf|wfuzz|wpscan|semrush|ahrefs|mj12bot|dotbot|petalbot|bytespider|censys|shodan)" 1;
}

limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;
limit_req_status 444;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    if ($bad_agent) {
        return 444;
    }

    if ($args ~* "(author=[0-9]+|rest_route=|wp_|\.\./|union.*select|base64_|/etc/passwd)") {
        return 444;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # no php here
    location ~* \.(php|php[0-9]|phtml|phar|phps|asp|aspx|jsp|cgi|pl|py|sh)$ {
        return 444;
    }

    # wordpress probes
    location ~* ^/(wp-admin|wp-content|wp-includes|wp-json|wp-login\.php|wp-cron\.php|xmlrpc\.php|wlwmanifest\.xml|wp-comments-post\.php|wp-trackback\.php|wp-links-opml\.php|wp-config\.php|setup-config\.php|readme\.html|license\.txt|install\.php|upgrade\.php) {
        return 444;
    }

    # dotfiles etc
    location ~* (^|/)\.(git|svn|hg|env|aws|htaccess|htpasswd|DS_Store|ssh|idea|vscode)(/|$) {
        return 444;
    }
    location ~* \.(sql|bak|old|orig|save|swp|swo|log|ini|ya?ml|conf|dist)$ {
        return 444;
    }
    location ~* ^/(phpmyadmin|pma|adminer|mysql|admin\.php|shell\.php|config\.php|actuator|solr|hudson|jenkins|cgi-bin|boaform|HNAP1|vendor/phpunit|telescope|manager/html|console) {
        return 444;
    }

    # hashed assets, safe to cache forever
    location ^~ /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # /ar should hit ar.html, not the ar/ directory
    location / {
        limit_req zone=perip burst=60 nodelay;
        try_files $uri.html $uri $uri/index.html =404;
    }
}
