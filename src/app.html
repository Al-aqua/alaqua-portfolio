<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%

		<!-- OpenPanel -->
		<script>
			window.op =
				window.op ||
				(function () {
					var n = [];
					return new Proxy(
						function () {
							arguments.length && n.push([].slice.call(arguments));
						},
						{
							get: function (t, r) {
								return 'q' === r
									? n
									: function () {
											n.push([r].concat([].slice.call(arguments)));
										};
							},
							has: function (t, r) {
								return 'q' === r;
							}
						}
					);
				})();
			window.op('init', {
				clientId: '%sveltekit.env.PUBLIC_OPENPANEL_CLIENT_ID%',
				apiUrl: 'https://opapi-pgs88s8ck0o08gc4ok0cgok4.alaqua.dev',
				trackScreenViews: true,
				trackOutgoingLinks: true,
				trackAttributes: true
			});
		</script>
		<script src="https://opdashboard.alaqua.dev/op1.js" defer async></script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
